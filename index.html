<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- PNG icons first so Android home-screen / shortcut selection uses
       the raster app icon (the card-fan PNG) rather than falling back
       to the small SVG favicon. SVG is kept for crisp browser tabs. -->
  <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
  <link rel="icon" type="image/svg+xml" href="%VITE_ICON_PATH%" />
  <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Desktop-site mode rescue. When Chrome's "Desktop site" is on
       (global, or per-site), a phone gets a huge layout viewport (e.g.
       2560px) that the page CANNOT override — width=device-width is
       ignored — so the whole UI renders microscopic (a real user 2-star
       review hit exactly this). We can't fix the viewport, but CSS
       `zoom` scales the effective CSS pixels, which DOES move the media
       queries, so we counter-scale until the effective width lands in
       the normal mobile range and the readable mobile layout returns.
       `zoom` is a Chromium property — exactly what a TWA / Chrome runs.

       Strict guards so it fires ONLY for a phone forced into desktop
       mode, and is a no-op for everyone else:
         - UA has no "Mobile"        -> desktop UA (desktop-site or PC)
         - primary pointer is coarse -> touch is the main input
         - NO fine pointer anywhere  -> excludes touch laptops/desktops
         - viewport > 900px          -> implausibly wide for a real phone
         - viewport >> physical screen (innerWidth > screen.width*1.4)
           -> the layout viewport is INFLATED vs the device. A real
              touch tablet (Surface Pro, iPad, Android tablet) has
              innerWidth ~= screen.width, so this excludes them; only a
              phone whose desktop-mode viewport balloons past its screen
              trips it. This is the condition that distinguishes "phone
              forced to desktop" from a genuine wide touch device.
       Runs before first paint, and re-applies on resize/orientation. -->
  <script>
    (function () {
      var TARGET = 412; // effective mobile width to emulate
      function applyDesktopModeFix() {
        var el = document.documentElement;
        el.style.zoom = ''; // reset first so innerWidth reads the raw viewport
        var raw = window.innerWidth;
        var scr = (window.screen && window.screen.width) || raw;
        var forced =
          !/Mobile/i.test(navigator.userAgent) &&
          window.matchMedia('(pointer: coarse)').matches &&
          !window.matchMedia('(any-pointer: fine)').matches &&
          raw > 900 &&
          raw > scr * 1.4; // viewport much wider than the physical screen
        if (forced) el.style.zoom = (raw / TARGET).toFixed(3);
      }
      applyDesktopModeFix();
      window.addEventListener('resize', applyDesktopModeFix);
      window.addEventListener('orientationchange', applyDesktopModeFix);
    })();
  </script>
  <!-- On-screen viewport diagnostic. Activates ONLY when the URL has
       ?diag (or #diag), so it never affects normal users. Phones have
       no console, so this prints the key viewport numbers in a big box
       on screen. Tests whether a FIXED-width viewport is honored in
       desktop mode (width=device-width is known to be ignored). Tap to
       dismiss. Remove once we've decided the desktop-mode fix. -->
  <script>
    (function () {
      if (!/diag/.test(location.search + location.hash)) return;
      function run() {
        var el = document.documentElement;
        el.style.zoom = ''; // undo the rescue zoom for a clean read
        var m = document.querySelector('meta[name="viewport"]');
        var before = window.innerWidth;
        var scr = (window.screen && window.screen.width) || 0;
        var dpr0 = window.devicePixelRatio;
        var ua = navigator.userAgent;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;' +
          'z-index:2147483647;background:#111;color:#fff;padding:3vw;' +
          'font:600 3.2vw/1.5 system-ui,sans-serif;white-space:pre-wrap;' +
          'word-break:break-word;border-bottom:0.6vw solid #F4D03F;';
        box.textContent = 'DIAG — measuring…';
        document.body.appendChild(box);
        m.setAttribute('content', 'width=412, initial-scale=1, viewport-fit=cover');
        setTimeout(function () {
          var afterFixed = window.innerWidth;
          var dpr1 = window.devicePixelRatio;
          m.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
          setTimeout(function () {
            var afterDW = window.innerWidth;
            box.textContent =
              'DIAG (tap to dismiss)\n' +
              'before inner: ' + before + '\n' +
              'screen.width: ' + scr + '\n' +
              'dpr: ' + dpr0 + '\n' +
              'after width=412 : ' + afterFixed + '  (dpr ' + dpr1 + ')\n' +
              'after device-width: ' + afterDW + '\n' +
              'ratio inner/screen: ' + (scr ? (before / scr).toFixed(2) : 'n/a') + '\n' +
              'UA: ' + ua;
            box.onclick = function () { box.remove(); };
          }, 700);
        }, 700);
      }
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', run);
      } else { run(); }
    })();
  </script>
  <meta name="theme-color" content="%VITE_THEME_COLOR%" />
  <meta name="description" content="%VITE_APP_DESCRIPTION%" />
  <!-- iOS standalone PWA install -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />
  <link rel="manifest" href="/manifest.json" />
  <title>%VITE_APP_NAME%</title>

  <!-- Umami, Plausible -->
  <script defer src="%VITE_UMAMI_SCRIPT_URL%" data-website-id="%VITE_UMAMI_WEBSITE_ID%"></script>
  <script async src="%VITE_PLAUSIBLE_SCRIPT_URL%"></script>
  <script>
    window.plausible = window.plausible || function () { (plausible.q = plausible.q || []).push(arguments) }, plausible.init = plausible.init || function (i) { plausible.o = i || {} };
    plausible.init()
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Swetrix -->
  <script src="%VITE_SWETRIX_SCRIPT_URL%" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      swetrix.init('%VITE_SWETRIX_PROJECT_ID%', {
        apiURL: '%VITE_SWETRIX_API_URL%',
      })
      swetrix.trackViews()
    })
  </script>

  <!-- Register Service Worker for offline support.
       Skip in Vite dev (localhost): the SW's /index.html fallback
       intercepts module-script requests (returning HTML for .tsx →
       MIME error) and hijacks the HMR WebSocket. Also unregister
       any previously-installed SW on localhost so a stale
       registration from a prior `vite preview` / production session
       can't keep intercepting. Production keeps the SW unchanged. -->
  <script>
    if ('serviceWorker' in navigator) {
      var __isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (__isDev) {
        navigator.serviceWorker.getRegistrations()
          .then(regs => regs.forEach(r => r.unregister()))
          .catch(() => {});
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    }

    // Request persistent storage so the SW cache and localStorage aren't
    // evicted when the device is low on disk or the app hasn't been opened
    // for weeks (Android: ~60 days, iOS Safari: ~7 days). Granted silently
    // for installed PWAs/TWAs.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(isPersisted => {
        if (!isPersisted) navigator.storage.persist();
      });
    }

    // PWA installation counter
    window.addEventListener('appinstalled', () => {
      if (window.umami?.track) window.umami.track('pwa_install');
      if (window.plausible) window.plausible('pwa_install');
      if (window.swetrix?.track) window.swetrix.track({ ev: 'pwa_install' });
    });
  </script>

  <!-- Swetrix noscript fallback -->
  <noscript>
    <img src="%VITE_SWETRIX_API_URL%/noscript?pid=%VITE_SWETRIX_PROJECT_ID%" alt=""
      referrerpolicy="no-referrer-when-downgrade" />
  </noscript>

</body>

</html>
