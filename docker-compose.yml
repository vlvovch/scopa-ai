services:
  scopa-server:
    build:
      context: ./scopa-server
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - scopa-server
    ports:
      - "127.0.0.1:8787:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - frontend
    command: tunnel --no-autoupdate --url http://frontend:80