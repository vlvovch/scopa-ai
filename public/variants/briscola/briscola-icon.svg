<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square in Briscola's indigo -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#1A237E"/>

  <!-- Tilted gold card representing the briscola (trump) -->
  <g transform="rotate(-15 32 32)">
    <rect x="14" y="18" width="36" height="28" rx="4" fill="#F4D03F" stroke="#1A237E" stroke-width="1.2"/>
    <rect x="14" y="18" width="36" height="28" rx="4" fill="none" stroke="#D4AF37" stroke-width="0.5"/>

    <!-- Bold "A" in the center for Ace of trumps -->
    <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="900" fill="#1A237E" text-anchor="middle">A</text>
  </g>

  <!-- Subtle shine across the card -->
  <ellipse cx="24" cy="22" rx="10" ry="3" fill="rgba(255,255,255,0.35)" transform="rotate(-15 32 32)"/>
</svg>
